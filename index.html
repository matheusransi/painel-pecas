<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Painel VRZ - Gestão de Peças</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

    <style>
        :root { --primary: #e30613; --bg: #0f0f10; --card: #18181b; --border: #27272a; --text: #a1a1aa; }
        body { font-family: 'Inter', sans-serif; margin: 0; background: var(--bg); color: #fff; overflow-x: hidden; }
        header { background: #000; padding: 18px; font-size: 20px; font-weight: 700; border-bottom: 3px solid var(--primary); display: flex; align-items: center; gap: 15px; position: sticky; top: 0; z-index: 1000; }
        .container { padding: 20px; max-width: 1400px; margin: auto; }
        
        /* Sidebar Totalmente Restaurada */
        #sideMenu { position: fixed; top: 0; left: -280px; width: 250px; height: 100%; background: #0b0b0b; transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); z-index: 1100; padding: 25px; border-right: 1px solid var(--border); box-shadow: 15px 0 30px rgba(0,0,0,0.7); }
        .menu-item { display: block; padding: 14px; color: #fff; text-decoration: none; border-radius: 8px; margin-bottom: 8px; font-weight: 500; transition: 0.2s; }
        .menu-item:hover { background: var(--primary); transform: translateX(5px); }

        /* Dashboard */
        .dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .stat-card { background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid var(--border); }
        .stat-card span { color: var(--text); font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
        .stat-card h2 { margin: 8px 0 0 0; font-size: 28px; font-weight: 700; }

        .tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
        .tabs button { background: var(--card); border: 1px solid var(--border); padding: 10px 18px; color: #fff; border-radius: 8px; cursor: pointer; font-size: 13px; transition: 0.3s; }
        .tabs button.active { background: var(--primary); border-color: var(--primary); font-weight: 600; }

        /* OS Cards */
        .os-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 15px; }
        .os-card { background: var(--card); border-radius: 12px; border: 1px solid var(--border); overflow: hidden; height: fit-content; }
        .os-header { background: #111; padding: 12px 15px; border-bottom: 2px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .os-model { color: var(--primary); font-weight: 800; text-transform: uppercase; }
        .os-body { padding: 15px; }
        
        .part-row { padding: 12px 0; border-bottom: 1px solid #27272a; display: flex; justify-content: space-between; align-items: center; }
        .part-row:last-child { border-bottom: none; }
        
        .badge { font-size: 9px; padding: 3px 8px; border-radius: 4px; font-weight: 700; text-transform: uppercase; }
        .bg-atrasada { background: #450a0a; color: #f87171; }
        .bg-prazo { background: #064e3b; color: #34d399; }
        .bg-hoje { background: #3f3f46; color: #fff; }
        
        .stock-tag { background: #16a34a; color: #fff; font-size: 9px; padding: 2px 6px; border-radius: 4px; margin-top: 6px; display: inline-block; font-weight: 800; }
        .stock-none { background: #450a0a; color: #f87171; font-size: 9px; padding: 2px 6px; border-radius: 4px; margin-top: 6px; display: inline-block; font-weight: 800; }

        .hidden { display: none; }
        table { width: 100%; font-size: 13px; margin-top: 10px; border-collapse: collapse; }
        td { padding: 6px 0; border-bottom: 1px solid var(--border); }
    </style>
</head>
<body>

<div id="sideMenu">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:40px;">
        <b style="color:var(--primary); font-size: 20px;">MENU VRZ</b>
        <button onclick="toggleMenu()" style="background:none; border:none; color:#fff; cursor:pointer; font-size: 24px;">✕</button>
    </div>
    <a href="index.html" class="menu-item">📦 Solicitação de Peças</a>
    <a href="estoque.html" class="menu-item">📂 Estoque Geral</a>
    <a href="registro.html" class="menu-item">📝 Registrar Peça</a>
</div>

<header>
    <button onclick="toggleMenu()" style="background:none; border:none; color:#fff; font-size:26px; cursor:pointer;">☰</button>
    Painel VRZ - Controle de Reposição
</header>

<div class="container">
    <div class="dashboard">
        <div class="stat-card"><span>Total Peças</span><h2 id="tot-geral">0</h2></div>
        <div class="stat-card"><span>Atrasadas</span><h2 id="tot-atraso" style="color:#f87171">0</h2></div>
        <div class="stat-card"><span>No Prazo</span><h2 id="tot-prazo" style="color:#34d399">0</h2></div>
        <div class="stat-card"><span>Entregues Hoje</span><h2 id="tot-hoje">0</h2></div>
        <div class="stat-card">
            <span>Ranking Solicitantes</span>
            <table id="rank-body"><tbody></tbody></table>
        </div>
    </div>

    <div class="tabs">
        <button onclick="mudarAba('aba-hoje', this)" class="active">Movimento Hoje</button>
        <button onclick="mudarAba('aba-atraso', this)">Atrasadas</button>
        <button onclick="mudarAba('aba-prazo', this)">No Prazo</button>
        <button onclick="mudarAba('aba-cotar', this)">Cotação</button>
    </div>

    <div id="aba-hoje" class="tab-content os-grid"></div>
    <div id="aba-atraso" class="tab-content os-grid hidden"></div>
    <div id="aba-prazo" class="tab-content os-grid hidden"></div>
    <div id="aba-cotar" class="tab-content os-grid hidden"></div>
</div>

<script>
    const URL_SOLIC = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQXT05p1mxD9mFsRFqzeG4ebXF10jVJra0AncChPKXz6UcrtpYFMZ31qMpcSCKnvQ/pub?gid=1419345505&single=true&output=csv";
    const URL_ESTOQUE = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQXT05p1mxD9mFsRFqzeG4ebXF10jVJra0AncChPKXz6UcrtpYFMZ31qMpcSCKnvQ/pub?gid=1283911979&single=true&output=csv";

    let dadosSol = [], dadosEst = [];

    function toggleMenu() {
        let m = document.getElementById("sideMenu");
        m.style.left = (m.style.left === "0px" || m.style.left === "0") ? "-280px" : "0px";
    }

    function mudarAba(id, btn) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden'));
        document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.remove('hidden');
        btn.classList.add('active');
    }

    function getV(row, key) {
        let found = Object.keys(row).find(k => k.trim().toUpperCase() === key.toUpperCase());
        return found ? row[found].toString().trim() : "";
    }

    function converterD(v) {
        if (!v) return null;
        let s = v.toString().trim();
        let p = s.includes("/") ? s.split("/") : s.split("-");
        if (p.length !== 3) return null;
        return s.includes("/") ? new Date(p[2], p[1]-1, p[0]) : new Date(p[0], p[1]-1, p[2]);
    }

    function isHoje(d) {
        const h = new Date(); // Hoje: 01/06/2026
        return d && d.getDate() === h.getDate() && d.getMonth() === h.getMonth() && d.getFullYear() === h.getFullYear();
    }

    function checkStock(peca, mod) {
        if (!peca || !mod || dadosEst.length === 0) return null;
        return dadosEst.find(e => {
            let pE = (getV(e, "PEÇA") || getV(e, "DESCRIÇÃO DA PEÇA")).toUpperCase().trim();
            let mE = (getV(e, "MODELO") || getV(e, "VEÍCULO")).toUpperCase().trim();
            let sai = (getV(e, "DATA RETIRADA") || getV(e, "OS RECEPTOR")).trim();
            return mE === mod.toUpperCase().trim() && pE.includes(peca.toUpperCase().trim()) && sai === "";
        });
    }

    function carregar() {
        Papa.parse(URL_ESTOQUE + "&t=" + Date.now(), {
            download: true, header: true, skipEmptyLines: true,
            complete: (resE) => {
                dadosEst = resE.data;
                Papa.parse(URL_SOLIC + "&t=" + Date.now(), {
                    download: true, header: true, skipEmptyLines: true,
                    complete: (resS) => {
                        dadosSol = resS.data;
                        processar();
                    }
                });
            }
        });
    }

    function processar() {
        const hoje = new Date(); hoje.setHours(0,0,0,0);
        let cA = 0, cP = 0, cE = 0;
        let gH = {}, gA = {}, gP = {}, gC = {}, rank = {};

        dadosSol.forEach(r => {
            const os = getV(r, "OS") || "S/N";
            const mod = getV(r, "MODELO") || getV(r, "VEÍCULO") || "N/A";
            const peca = getV(r, "DESCRIÇÃO DA PEÇA") || getV(r, "PEÇA");
            const dS = converterD(getV(r, "DATA SOLICITAÇÃO") || getV(r, "DATA DE SOLICITAÇÃO"));
            const dC = converterD(getV(r, "DATA DA COMPRA"));
            const dEn = converterD(getV(r, "DATA DE ENTREGA"));
            const sol = getV(r, "SOLICITANTE");
            
            let pz = null;
            for (let k in r) { if (k.toUpperCase().includes("PRAZO")) pz = converterD(r[k]); }

            if (sol && dS && dS.getMonth() === hoje.getMonth()) rank[sol] = (rank[sol]||0) + 1;

            const item = { desc: peca, forn: getV(r, "FORNECEDOR"), st: "", cl: "", det: "" };

            if (isHoje(dS) || isHoje(dC) || isHoje(dEn)) {
                if (isHoje(dEn)) cE++;
                if (!gH[os]) gH[os] = { m: mod, i: [] };
                item.st = isHoje(dEn) ? "ENTREGUE" : (isHoje(dC) ? "COMPRADA" : "PEDIDA");
                item.cl = "bg-hoje";
                gH[os].i.push({...item});
            }

            if (!dEn && pz) {
                pz.setHours(0,0,0,0);
                if (hoje > pz) {
                    cA++; if (!gA[os]) gA[os] = { m: mod, i: [] };
                    item.st = "ATRASADA"; item.cl = "bg-atrasada";
                    item.det = "Vencimento: " + pz.toLocaleDateString();
                    gA[os].i.push({...item});
                } else {
                    cP++; if (!gP[os]) gP[os] = { m: mod, i: [] };
                    item.st = "NO PRAZO"; item.cl = "bg-prazo";
                    item.det = "Previsto: " + pz.toLocaleDateString();
                    gP[os].i.push({...item});
                }
            }

            let val = getV(r, "VALOR").toLowerCase();
            if (!val || val.includes("cot")) {
                if (!gC[os]) gC[os] = { m: mod, i: [] };
                item.st = "COTAR"; item.cl = "bg-atrasada";
                gC[os].i.push({...item});
            }
        });

        render('aba-hoje', gH, "#e30613");
        render('aba-atraso', gA, "#6b7280");
        render('aba-prazo', gP, "#15803d");
        render('aba-cotar', gC, "#1d4ed8");

        document.getElementById('tot-geral').innerText = dadosSol.length;
        document.getElementById('tot-atraso').innerText = cA;
        document.getElementById('tot-prazo').innerText = cP;
        document.getElementById('tot-hoje').innerText = cE;

        let rSorted = Object.entries(rank).sort((a,b) => b[1] - a[1]).slice(0,3);
        document.querySelector('#rank-body tbody').innerHTML = rSorted.map(i => `<tr><td>${i[0]}</td><td style="text-align:right"><b>${i[1]}</b></td></tr>`).join('');
    }

    function render(id, grupo, cor) {
        const div = document.getElementById(id);
        div.innerHTML = "";
        for (let os in grupo) {
            let parts = grupo[os].i.map(i => {
                let s = checkStock(i.desc, grupo[os].m);
                let tag = s ? `<div class="stock-tag">✓ ESTOQUE (${getV(s, "NUMERAÇÃO") || getV(s, "NÚMERO") || "S/L"})</div>` : `<div class="stock-none">✕ FALTA</div>`;
                return `<div class="part-row"><div class="part-main"><div>${i.desc}</div><div style="font-size:11px;color:var(--text)">Forn: ${i.forn} ${i.det ? ' | '+i.det : ''}</div>${tag}</div><span class="badge ${i.cl}">${i.st}</span></div>`;
            }).join('');
            div.innerHTML += `<div class="os-card"><div class="os-header" style="border-left:4px solid ${cor}"><div class="os-info">OS ${os} <span class="os-model">${grupo[os].m}</span></div></div><div class="os-body">${parts}</div></div>`;
        }
        if (Object.keys(grupo).length === 0) div.innerHTML = "<div style='color:var(--text); padding:40px; text-align:center;'>Nenhum dado encontrado para hoje.</div>";
    }

    carregar();
    setInterval(carregar, 30000);
</script>
</body>
</html>
