<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Painel VRZ - Controle de Reposição</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

    <style>
        :root { --primary: #e30613; --bg: #0f0f10; --card: #18181b; --border: #27272a; --text: #a1a1aa; }
        body { font-family: 'Inter', sans-serif; margin: 0; background: var(--bg); color: #fff; overflow-x: hidden; }
        
        header { background: #000; padding: 20px; font-size: 20px; font-weight: 700; border-bottom: 3px solid var(--primary); display: flex; align-items: center; gap: 15px; position: sticky; top: 0; z-index: 100; }
        .container { padding: 25px; max-width: 1400px; margin: auto; }
        
        /* Sidebar Totalmente Restaurada */
        #sideMenu { position: fixed; top: 0; left: -280px; width: 250px; height: 100%; background: #0b0b0b; transition: 0.4s; z-index: 1000; padding: 20px; border-right: 1px solid var(--border); box-shadow: 10px 0 20px rgba(0,0,0,0.5); }
        .menu-item { display: block; padding: 12px; color: #fff; text-decoration: none; border-radius: 6px; margin-bottom: 5px; }
        .menu-item:hover { background: var(--primary); }

        /* Dashboard Stats */
        .dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .stat-card { background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid var(--border); box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .stat-card span { color: var(--text); font-size: 11px; text-transform: uppercase; }
        .stat-card h2 { margin: 8px 0 0 0; font-size: 28px; }

        .tabs { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .tabs button { background: var(--card); border: 1px solid var(--border); padding: 12px 18px; color: #fff; border-radius: 8px; cursor: pointer; transition: 0.3s; }
        .tabs button.active { background: var(--primary); border-color: var(--primary); }

        /* Layout de Cards por OS */
        .os-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 15px; }
        .os-card { background: var(--card); border-radius: 12px; border: 1px solid var(--border); overflow: hidden; margin-bottom: 10px; }
        .os-header { background: #111; padding: 12px 15px; border-bottom: 2px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .os-info { font-weight: 700; font-size: 14px; }
        .os-model { color: var(--primary); font-weight: 800; margin-left: 5px; text-transform: uppercase; }
        .os-body { padding: 15px; }
        
        .part-row { padding: 10px 0; border-bottom: 1px solid #27272a; display: flex; justify-content: space-between; align-items: center; }
        .part-row:last-child { border-bottom: none; }
        
        .badge { font-size: 9px; padding: 3px 8px; border-radius: 4px; font-weight: 700; text-transform: uppercase; }
        .bg-atrasada { background: #450a0a; color: #f87171; }
        .bg-prazo { background: #064e3b; color: #34d399; }
        .bg-hoje { background: #3f3f46; color: #fff; }
        
        .stock-tag { background: #16a34a; color: #fff; font-size: 9px; padding: 3px 8px; border-radius: 4px; margin-top: 8px; display: inline-block; font-weight: 800; }
        .stock-none { background: #333; color: #999; font-size: 9px; padding: 3px 8px; border-radius: 4px; margin-top: 8px; display: inline-block; font-weight: 800; }

        .hidden { display: none; }
        table { width: 100%; font-size: 13px; margin-top: 10px; border-collapse: collapse; }
        td { padding: 6px 0; border-bottom: 1px solid var(--border); }
    </style>
</head>
<body>

<div id="sideMenu">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:30px;">
        <b style="color:var(--primary)">MENU VRZ</b>
        <button onclick="toggleMenu()" style="background:none; border:none; color:#fff; cursor:pointer; font-size: 20px;">✕</button>
    </div>
    <a href="index.html" class="menu-item">Solicitação de Peças</a>
    <a href="estoque.html" class="menu-item">Estoque Geral</a>
    <a href="registro.html" class="menu-item">Registrar Peça</a>
</div>

<header>
    <button onclick="toggleMenu()" style="background:none; border:none; color:#fff; font-size:24px; cursor:pointer;">☰</button>
    Painel VRZ - Controle de Reposição
</header>

<div class="container">
    <div class="dashboard">
        <div class="stat-card"><span>Peças Ativas</span><h2 id="total-pecas">0</h2></div>
        <div class="stat-card"><span>Atrasadas</span><h2 id="total-atrasadas" style="color:#f87171">0</h2></div>
        <div class="stat-card"><span>No Prazo</span><h2 id="total-prazo" style="color:#34d399">0</h2></div>
        <div class="stat-card"><span>Entregues Hoje</span><h2 id="total-entregues">0</h2></div>
        <div class="stat-card">
            <span>Ranking Solicitantes (Mês)</span>
            <table id="ranking-corpo"><tbody></tbody></table>
        </div>
    </div>

    <div class="tabs">
        <button onclick="aba('aba-hoje', this)" class="active">Movimento Hoje</button>
        <button onclick="aba('aba-atraso', this)">Atrasadas</button>
        <button onclick="aba('aba-prazo', this)">No Prazo</button>
        <button onclick="aba('aba-cotar', this)">Cotação</button>
    </div>

    <div id="aba-hoje" class="tab-content os-grid"></div>
    <div id="aba-atraso" class="tab-content os-grid hidden"></div>
    <div id="aba-prazo" class="tab-content os-grid hidden"></div>
    <div id="aba-cotar" class="tab-content os-grid hidden"></div>
</div>

<script>
    // Configurações Globais
    const URL_SOLIC = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQXT05p1mxD9mFsRFqzeG4ebXF10jVJra0AncChPKXz6UcrtpYFMZ31qMpcSCKnvQ/pub?gid=1419345505&single=true&output=csv";
    const URL_ESTOQUE = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQXT05p1mxD9mFsRFqzeG4ebXF10jVJra0AncChPKXz6UcrtpYFMZ31qMpcSCKnvQ/pub?gid=1283911979&single=true&output=csv";

    let dadosSol = [], dadosEst = [];

    function toggleMenu() {
        let m = document.getElementById("sideMenu");
        m.style.left = (m.style.left === "0px" || m.style.left === "0") ? "-280px" : "0px";
    }

    function aba(id, btn) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden'));
        document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.remove('hidden');
        btn.classList.add('active');
    }

    function normalizar(texto) {
        return (texto || "").toString().trim().toUpperCase();
    }

    function getV(row, key) {
        let found = Object.keys(row).find(k => k.trim().toUpperCase() === key.toUpperCase());
        return found ? row[found].toString().trim() : "";
    }

    function converterData(v) {
        if (!v) return null;
        let s = v.toString().trim();
        let p = s.includes("/") ? s.split("/") : s.split("-");
        if (p.length !== 3) return null;
        // DD/MM/AAAA ou AAAA-MM-DD
        return s.includes("/") ? new Date(p[2], p[1]-1, p[0]) : new Date(p[0], p[1]-1, p[2]);
    }

    function ehHoje(d) {
        const h = new Date(); // Hoje: 01/06/2026
        return d && d.getDate() === h.getDate() && d.getMonth() === h.getMonth() && d.getFullYear() === h.getFullYear();
    }

    function consultarEstoque(peca, modelo) {
        if (!peca || !modelo || dadosEst.length === 0) return null;
        let pB = peca.toUpperCase().trim();
        let mB = modelo.toUpperCase().trim();

        return dadosEst.find(e => {
            let pE = (getV(e, "PEÇA") || getV(e, "DESCRIÇÃO DA PEÇA")).toUpperCase().trim();
            let mE = (getV(e, "MODELO") || getV(e, "VEÍCULO")).toUpperCase().trim();
            let sai = (getV(e, "DATA RETIRADA") || getV(e, "OS RECEPTOR")).trim();
            return mE === mB && pE.includes(pB) && sai === "";
        });
    }

    function carregar() {
        // Carregamento independente para não travar
        Papa.parse(URL_SOLIC + "&t=" + Date.now(), {
            download: true, header: true, skipEmptyLines: true,
            complete: function(resS) {
                dadosSol = resS.data;
                processar();
            },
            error: function(e) { console.error("Erro solicitações:", e); }
        });

        Papa.parse(URL_ESTOQUE + "&t=" + Date.now(), {
            download: true, header: true, skipEmptyLines: true,
            complete: function(resE) {
                dadosEst = resE.data;
                processar();
            },
            error: function(e) { console.warn("Erro estoque (CORS/URL):", e); }
        });
    }

    function processar() {
        if (dadosSol.length === 0) return;

        const agora = new Date(); agora.setHours(0,0,0,0);
        let cA = 0, cP = 0, cE = 0;
        let gH = {}, gA = {}, gP = {}, gC = {}, rank = {};

        dadosSol.forEach(r => {
            const os = getV(r, "OS") || "S/N";
            const mod = (getV(r, "MODELO") || getV(r, "VEÍCULO") || "N/A").toUpperCase();
            const peca = getV(r, "DESCRIÇÃO DA PEÇA") || getV(r, "PEÇA");
            const dS = converterData(getV(r, "DATA SOLICITAÇÃO") || getV(r, "DATA DE SOLICITAÇÃO"));
            const dC = converterData(getV(r, "DATA DA COMPRA"));
            const dEn = converterData(getV(r, "DATA DE ENTREGA"));
            const sol = getV(r, "SOLICITANTE");
            
            let pz = null;
            for (let k in r) { if (k.toUpperCase().includes("PRAZO")) pz = converterData(r[k]); }

            // Ranking Solicitantes
            if (sol && dS && dS.getMonth() === agora.getMonth()) {
                rank[sol] = (rank[sol] || 0) + 1;
            }

            const item = { desc: peca, forn: getV(r, "FORNECEDOR"), st: "", cl: "", det: "" };

            // 1. Movimento Hoje (01/06/2026)
            if (ehHoje(dS) || ehHoje(dC) || ehHoje(dEn)) {
                if (ehHoje(dEn)) cE++;
                if (!gH[os]) gH[os] = { m: mod, i: [] };
                item.st = ehHoje(dEn) ? "ENTREGUE" : (ehHoje(dC) ? "COMPRADA" : "PEDIDA");
                item.cl = "bg-hoje";
                gH[os].i.push({...item});
            }

            // 2. Atraso e Prazo
            if (!dEn && pz) {
                pz.setHours(0,0,0,0);
                if (agora > pz) {
                    cA++; if (!gA[os]) gA[os] = { m: mod, i: [] };
                    item.st = "ATRASADA"; item.cl = "bg-atrasada";
                    item.det = "Vencimento: " + pz.toLocaleDateString();
                    gA[os].i.push({...item});
                } else {
                    cP++; if (!gP[os]) gP[os] = { m: mod, i: [] };
                    item.st = "NO PRAZO"; item.cl = "bg-prazo";
                    item.det = "Previsto: " + pz.toLocaleDateString();
                    gP[os].i.push({...item});
                }
            }

            // 3. Cotação
            let v = getV(r, "VALOR").toLowerCase();
            if (!v || v.includes("cot")) {
                if (!gC[os]) gC[os] = { m: mod, i: [] };
                item.st = "COTAR"; item.cl = "bg-atrasada";
                gC[os].i.push({...item});
            }
        });

        desenhar('aba-hoje', gH, "#e30613");
        desenhar('aba-atraso', gA, "#6b7280");
        desenhar('aba-prazo', gP, "#15803d");
        desenhar('aba-cotar', gC, "#1d4ed8");

        document.getElementById('total-pecas').innerText = dadosSol.length;
        document.getElementById('total-atrasadas').innerText = cA;
        document.getElementById('total-prazo').innerText = cP;
        document.getElementById('total-entregues').innerText = cE;

        let rSorted = Object.entries(rank).sort((a,b) => b[1] - a[1]).slice(0,3);
        document.querySelector('#ranking-corpo tbody').innerHTML = rSorted.map(i => `<tr><td>${i[0]}</td><td style="text-align:right"><b>${i[1]}</b></td></tr>`).join('');
    }

    function desenhar(containerId, grupo, cor) {
        const div = document.getElementById(containerId);
        div.innerHTML = "";
        for (let os in grupo) {
            let parts = grupo[os].i.map(i => {
                let est = consultarEstoque(i.desc, grupo[os].m);
                let tag = est ? `<div class="stock-tag">✓ ESTOQUE (${getV(est, "NUMERAÇÃO") || getV(est, "NÚMERO") || "S/L"})</div>` : `<div class="stock-none">✕ SEM STOCK</div>`;
                return `<div class="part-row"><div class="part-main"><div>${i.desc}</div><div style="font-size:11px;color:var(--text)">Forn: ${i.forn} ${i.det ? ' | '+i.det : ''}</div>${tag}</div><span class="badge ${i.cl}">${i.st}</span></div>`;
            }).join('');
            div.innerHTML += `<div class="os-card"><div class="os-header" style="border-left:4px solid ${cor}"><div class="os-info">OS ${os} <span class="os-model">${grupo[os].m}</span></div></div><div class="os-body">${parts}</div></div>`;
        }
        if (Object.keys(grupo).length === 0) div.innerHTML = "<div style='color:var(--text); padding:40px; text-align:center;'>Nenhuma movimentação para esta categoria.</div>";
    }

    carregar();
    setInterval(carregar, 30000);
</script>
</body>
</html>
