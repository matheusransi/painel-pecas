<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Painel de Controle - VRZ</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

    <style>
        :root { --primary: #e30613; --bg: #0f0f10; --card: #18181b; --border: #27272a; --text: #a1a1aa; }
        body { font-family: 'Inter', sans-serif; margin: 0; background: var(--bg); color: #fff; }
        header { background: #000; padding: 20px; font-size: 20px; font-weight: 700; border-bottom: 3px solid var(--primary); display: flex; align-items: center; gap: 15px; }
        .container { padding: 25px; max-width: 1400px; margin: auto; }
        
        .dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .stat-card { background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid var(--border); }
        .stat-card span { color: var(--text); font-size: 11px; text-transform: uppercase; }
        .stat-card h2 { margin: 8px 0 0 0; font-size: 28px; }

        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tabs button { background: var(--card); border: 1px solid var(--border); padding: 12px 18px; color: #fff; border-radius: 8px; cursor: pointer; }
        .tabs button.active { background: var(--primary); }

        .os-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 15px; }
        .os-card { background: var(--card); border-radius: 12px; border: 1px solid var(--border); padding: 15px; }
        .os-header { border-bottom: 1px solid var(--border); padding-bottom: 10px; margin-bottom: 10px; display: flex; justify-content: space-between; }
        .os-model { color: var(--primary); font-weight: 800; }
        
        .part-item { padding: 8px 0; border-bottom: 1px solid #27272a; display: flex; justify-content: space-between; align-items: center; }
        .badge { font-size: 10px; padding: 4px 8px; border-radius: 4px; font-weight: 700; text-transform: uppercase; }
        .bg-hoje { background: #3f3f46; color: #fff; }
        .bg-atrasada { background: #450a0a; color: #f87171; }
        .bg-prazo { background: #064e3b; color: #34d399; }

        .stock-tag { background: #16a34a; color: #fff; font-size: 9px; padding: 2px 6px; border-radius: 4px; margin-top: 5px; display: inline-block; }

        #sideMenu { position: fixed; top: 0; left: -280px; width: 250px; height: 100%; background: #000; transition: 0.4s; z-index: 1000; padding: 20px; border-right: 1px solid var(--border); }
        .menu-link { display: block; padding: 12px; color: #fff; text-decoration: none; border-radius: 6px; }
        .menu-link:hover { background: var(--primary); }
        .hidden { display: none; }
    </style>
</head>
<body>

<div id="sideMenu">
    <div style="display:flex; justify-content:space-between; margin-bottom:30px;">
        <b style="color:var(--primary)">MENU VRZ</b>
        <button onclick="toggleMenu()" style="background:none; border:none; color:#fff; cursor:pointer;">✕</button>
    </div>
    <a href="index.html" class="menu-link">Painel Principal</a>
    <a href="estoque.html" class="menu-link">Estoque</a>
</div>

<header>
    <button onclick="toggleMenu()" style="background:none; border:none; color:#fff; font-size:24px; cursor:pointer;">☰</button>
    Controle de Reposição - Blindadora
</header>

<div class="container">
    <div class="dashboard">
        <div class="stat-card"><span>Total Ativas</span><h2 id="tot-geral">0</h2></div>
        <div class="stat-card"><span>Atrasadas</span><h2 id="tot-atraso" style="color:#f87171">0</h2></div>
        <div class="stat-card"><span>No Prazo</span><h2 id="tot-prazo" style="color:#34d399">0</h2></div>
        <div class="stat-card"><span>Ranking (Mês)</span><table style="width:100%; font-size:12px;"><tbody id="rank-body"></tbody></table></div>
    </div>

    <div class="tabs">
        <button onclick="switchAba('aba-hoje', this)" class="active">Movimento Hoje</button>
        <button onclick="switchAba('aba-atraso', this)">Atrasadas</button>
        <button onclick="switchAba('aba-prazo', this)">No Prazo</button>
    </div>

    <div id="aba-hoje" class="tab-content os-grid"></div>
    <div id="aba-atraso" class="tab-content os-grid hidden"></div>
    <div id="aba-prazo" class="tab-content os-grid hidden"></div>
</div>

<script>
    const URL_SOLIC = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQXT05p1mxD9mFsRFqzeG4ebXF10jVJra0AncChPKXz6UcrtpYFMZ31qMpcSCKnvQ/pub?gid=1419345505&single=true&output=csv";
    const URL_ESTOQUE = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQXT05p1mxD9mFsRFqzeG4ebXF10jVJra0AncChPKXz6UcrtpYFMZ31qMpcSCKnvQ/pub?gid=1283911979&single=true&output=csv";

    let dadosS = [], dadosE = [];

    function toggleMenu() {
        let m = document.getElementById("sideMenu");
        m.style.left = m.style.left === "0px" ? "-280px" : "0px";
    }

    function switchAba(id, btn) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden'));
        document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.remove('hidden');
        btn.classList.add('active');
    }

    // Função para pegar o valor de uma coluna ignorando espaços e maiúsculas
    function getV(row, key) {
        const found = Object.keys(row).find(k => k.trim().toUpperCase() === key.toUpperCase());
        return found ? row[found].toString().trim() : "";
    }

    function parseD(v) {
        if (!v) return null;
        const p = v.includes("/") ? v.split("/") : v.split("-");
        return v.includes("/") ? new Date(p[2], p[1]-1, p[0]) : new Date(p[0], p[1]-1, p[2]);
    }

    function isHoje(d) {
        const h = new Date(); // 01/06/2026
        return d && d.getDate() === h.getDate() && d.getMonth() === h.getMonth() && d.getFullYear() === h.getFullYear();
    }

    function checkEstoque(peca, mod) {
        if (!peca || !mod || dadosE.length === 0) return null;
        return dadosE.find(e => {
            const pE = (getV(e, "PEÇA") || getV(e, "DESCRIÇÃO DA PEÇA")).toUpperCase();
            const mE = (getV(e, "MODELO") || getV(e, "VEÍCULO")).toUpperCase();
            const sai = getV(e, "DATA RETIRADA") || getV(e, "OS RECEPTOR");
            return mE === mod.toUpperCase() && pE.includes(peca.toUpperCase()) && !sai;
        });
    }

    function carregar() {
        console.log("Iniciando carregamento...");
        Papa.parse(URL_ESTOQUE + "&t=" + Date.now(), {
            download: true, header: true, skipEmptyLines: true,
            complete: (resE) => {
                dadosE = resE.data;
                console.log("Estoque carregado:", dadosE.length, "linhas");
                
                Papa.parse(URL_SOLIC + "&t=" + Date.now(), {
                    download: true, header: true, skipEmptyLines: true,
                    complete: (resS) => {
                        dadosS = resS.data;
                        console.log("Solicitações carregadas:", dadosS.length, "linhas");
                        if (dadosS.length > 0) console.log("Colunas detectadas:", Object.keys(dadosS[0]));
                        processar();
                    },
                    error: (err) => alert("Erro ao carregar Planilha de Solicitações: " + err)
                });
            },
            error: (err) => alert("Erro ao carregar Planilha de Estoque: " + err)
        });
    }

    function processar() {
        const agora = new Date(); agora.setHours(0,0,0,0);
        let cA = 0, cP = 0, gH = {}, gA = {}, gP = {}, rank = {};

        dadosS.forEach(r => {
            const os = getV(r, "OS") || "S/N";
            const mod = getV(r, "MODELO") || getV(r, "VEÍCULO") || "N/A";
            const peca = getV(r, "DESCRIÇÃO DA PEÇA") || getV(r, "PEÇA");
            const dS = parseD(getV(r, "DATA SOLICITAÇÃO") || getV(r, "DATA DE SOLICITAÇÃO"));
            const dC = parseD(getV(r, "DATA DA COMPRA"));
            const dE = parseD(getV(getV(r, "DATA DE ENTREGA"), "DATA ENTREGA"));
            const sol = getV(r, "SOLICITANTE");
            
            let pz = null;
            for (let k in r) { if (k.toUpperCase().includes("PRAZO")) pz = parseD(r[k]); }

            // Ranking
            if (sol && dS && dS.getMonth() === agora.getMonth()) { rank[sol] = (rank[sol] || 0) + 1; }

            const item = { p: peca, st: "", cl: "", det: getV(r, "FORNECEDOR") };

            // 1. Hoje
            if (isHoje(dS) || isHoje(dC) || isHoje(dE)) {
                if (!gH[os]) gH[os] = { m: mod, i: [] };
                item.st = dE ? "ENTREGUE" : (dC ? "COMPRADA" : "PEDIDA");
                item.cl = "bg-hoje";
                gH[os].i.push({...item});
            }

            // 2. Atraso/Prazo
            if (!dE && pz) {
                pz.setHours(0,0,0,0);
                if (agora > pz) {
                    cA++; if (!gA[os]) gA[os] = { m: mod, i: [] };
                    item.st = "ATRASADA"; item.cl = "bg-atrasada";
                    gA[os].i.push({...item});
                } else {
                    cP++; if (!gP[os]) gP[os] = { m: mod, i: [] };
                    item.st = "NO PRAZO"; item.cl = "bg-prazo";
                    gP[os].i.push({...item});
                }
            }
        });

        render('aba-hoje', gH, "#e30613");
        render('aba-atraso', gA, "#6b7280");
        render('aba-prazo', gP, "#15803d");

        document.getElementById('tot-geral').innerText = dadosS.length;
        document.getElementById('tot-atraso').innerText = cA;
        document.getElementById('tot-prazo').innerText = cP;

        let rS = Object.entries(rank).sort((a,b) => b[1]-a[1]).slice(0,3);
        document.getElementById('rank-body').innerHTML = rS.map(i => `<tr><td>${i[0]}</td><td style="text-align:right"><b>${i[1]}</b></td></tr>`).join('');
    }

    function render(id, grupo, cor) {
        const div = document.getElementById(id); div.innerHTML = "";
        for (let os in grupo) {
            let html = grupo[os].i.map(i => {
                const est = checkEstoque(i.p, grupo[os].m);
                const tag = est ? `<div class="stock-tag">✓ ESTOQUE (${getV(est, "NUMERAÇÃO") || getV(est, "NÚMERO") || "S/L"})</div>` : "";
                return `<div class="part-item"><div><b>${i.p}</b><br><small>${i.det}</small>${tag}</div><span class="badge ${i.cl}">${i.st}</span></div>`;
            }).join('');
            div.innerHTML += `<div class="os-card"><div class="os-header" style="border-left:4px solid ${cor}"><span>OS ${os} <b class="os-model">${grupo[os].m}</b></span></div>${html}</div>`;
        }
        if (Object.keys(grupo).length === 0) div.innerHTML = "<p style='text-align:center; color:var(--text); padding:20px;'>Nenhum dado encontrado.</p>";
    }

    carregar();
    setInterval(carregar, 30000);
</script>
</body>
</html>
